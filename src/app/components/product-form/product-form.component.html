<form #form="ngForm" (ngSubmit)="saveProduct(form)">
  <label>Nome:</label>
  <input type="text" [(ngModel)]="product.nome" name="nome" required />

  <label>Descrição:</label>
  <input type="text" [(ngModel)]="product.descricao" name="descricao" required />

  <label>Preço:</label>
  <input type="number" [(ngModel)]="product.preco" name="preco" required min="0" />

  <label>Imagem:</label>
  <div class="file-input-wrapper">
    <button type="button" class="file-btn">Escolher arquivo</button>
    <span class="file-name">{{ selectedFile?.name || 'Nenhum arquivo selecionado' }}</span>
    <input type="file" (change)="onFileSelected($event)" />
  </div>

  <button type="submit" [disabled]="form.invalid">
    {{ product.id ? 'Atualizar' : 'Cadastrar' }}
  </button>
</form>
