<div class="container" [class.right-panel-active]="rightPanelActive">
  <div class="form-container sign-up-container">
    <app-register (registered)="onRegistered()"></app-register>
  </div>
  <div class="form-container sign-in-container">
    <app-login></app-login>
  </div>
  <div class="overlay-container">
    <div class="overlay">
      <div class="overlay-panel overlay-left">
        <h1>Bem-vindo de volta!</h1>
        <p>Para continuar conectado conosco, faça login com suas informações pessoais</p>
        <button class="ghost" (click)="showSignIn()">Entrar</button>
      </div>
      <div class="overlay-panel overlay-right">
        <h1>Olá, Usuário!</h1>
        <p>Insira seus dados pessoais e comece sua jornada conosco</p>
        <button class="ghost" (click)="showSignUp()">Cadastrar</button>
      </div>
    </div>
  </div>
</div>
